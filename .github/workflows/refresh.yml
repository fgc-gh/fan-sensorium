name: Refresh and publish

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC, early morning in Eugene
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:                      # every branch: a push is a full real-data test run

permissions:
  contents: write   # commit data/manifest.json and data/derived/ on main
  pages: write
  id-token: write

concurrency:
  group: sensorium-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Unit tests (offline)
        run: python -m pytest -q tests

      - name: Fetch boundary and taxlots
        run: python pipeline/fetch_node.py

      - name: Build heat grid (skips if this summer set is already built)
        run: python pipeline/heat_node.py

      - name: Build site data
        run: python pipeline/build_site.py

      - name: Check contract
        run: python pipeline/contract.py ${{ github.ref == 'refs/heads/main' && '--write' || '' }}

      - name: Show what was built
        if: always()
        run: |
          cat data/manifest.json 2>/dev/null || true
          cat site/data/layers.json 2>/dev/null || true
          ls -la site/data 2>/dev/null || true

      - name: Commit manifest and heat grid
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "sensorium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/derived
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push

      - name: Upload preview (branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
          retention-days: 14

      - name: Upload Pages artifact (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
